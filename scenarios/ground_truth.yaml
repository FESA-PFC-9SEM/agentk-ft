# DRAFT ground truth for finetune/run_scenarios.py -- please review and
# correct before relying on the results. This was pre-filled from a manual
# read of each scenarios/*.yaml file, not computed by any detector.
#
# For each file:
#   missing_image_tag:  true if ANY container in the file has no tag or ":latest"
#   exposed_credentials: true if ANY plaintext secret/password/token/key is present
#   typos: freeform list of semantic bugs/typos found by reading the file (wrong
#     image name, misspelled path/command, selector/label mismatches, etc). Not
#     scored automatically -- recorded so you can eyeball whether the model's
#     "notes" caught them.

