# Baseline for namespace 'demo' -- written by demo/reset_cluster.py --snapshot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiware-orionld
spec:
  progressDeadlineSeconds: 600
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: orionld
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: orionld
      name: fiware-orion
    spec:
      containers:
      - args:
        - -dbhost
        - orionld-mongodb-svc:27017
        - -rplSet
        - orionld-mongodb
        - -dbuser
        - "usuarioz\xE3o"
        - -dbpwd
        - '123456789'
        - -dbAuthMech
        - SCRAM-SHA-256
        - -db
        - orion
        - -statCounters
        - -statSemWait
        - -statTiming
        - -statNotifQueue
        env:
        - name: ORIONLD_MONGOCONLY
          value: 'TRUE'
        - name: DB_PASSWORD
          value: hardcoded-password-123
        - name: API_KEY
          value: sk-1234567890abcdef
        image: fiware/orion-ld
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /version
            port: 1026
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        name: orion
        ports:
        - containerPort: 1026
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /version
            port: 1026
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 500Mi
          requests:
            cpu: 100m
            memory: 100Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
